name: Daily Depop + eBay Trends Scrape

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Depop scraper
        run: |
          python3 scraper.py \
            --out docs/sold_trends.json \
            --history-dir data/history \
            --debug \
            --capture-network

      - name: Run eBay scraper
  env:
    EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
    EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
    EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
  run: |
    python3 ebay_scraper.py

      - name: Commit updated results
        run: |
          git config user.name "depop-trends-bot"
          git config user.email "actions@github.com"

          git add \
            docs/sold_trends.json \
            data/history \
            data/ebay_history \
            debug_*.html \
            network_*.json

          git diff --cached --quiet && \
            echo "No changes to commit" || \
            git commit -m "Daily Depop + eBay scrape"

          git push
