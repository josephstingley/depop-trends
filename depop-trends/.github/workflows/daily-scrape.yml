name: Daily Depop Trends Scrape

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python3 scraper.py --out docs/sold_trends.json --history-dir data/history

      - name: Commit updated results
        run: |
          git config user.name "depop-trends-bot"
          git config user.email "actions@github.com"
          git add docs/sold_trends.json data/history
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Daily scrape update"
          git push
